# PyQuest CI：lint → 数据层冒烟 + 题库实跑 → 构建 → 全章节 E2E
# Tiny Swords 素材许可证禁止再分发、仓库不携带，CI 用 gen-ts-stubs 生成占位图跑逻辑验证
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-verify.txt

      - name: 安装依赖
        run: |
          npm ci
          pip install -r scripts/requirements-verify.txt
          npx playwright install --with-deps chromium

      - name: 生成 Tiny Swords 占位素材
        run: node scripts/gen-ts-stubs.mjs

      - name: Lint
        run: npm run lint

      - name: 冒烟测试 + 题库实跑校验
        run: npm test

      - name: 构建
        run: npm run build

      - name: E2E（全部章节）
        run: npm run test:e2e

      - name: 上传 E2E 截图（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: scripts/shots/
          if-no-files-found: ignore
